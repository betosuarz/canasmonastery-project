<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monasterio de Cañas · Guías</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --stone: #16120e;
      --stone-2: #2a231a;
      --gold: #c4a464;
      --gold-dim: rgba(196, 164, 100, .12);
      --white: #faf8f3;
      --muted: rgba(250, 248, 243, .45);
      --ff-d: 'Cormorant Garamond', Georgia, serif;
      --ff-b: 'Jost', sans-serif;
    }

    html,
    body {
      height: 100%;
      background: var(--stone);
      color: var(--white);
      font-family: var(--ff-b);
      font-weight: 300;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      gap: 0;
    }

    /* Radial glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(196, 164, 100, .08) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .logo-l1 {
      font-family: var(--ff-d);
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--white);
      letter-spacing: .04em;
      display: block;
    }

    .logo-l2 {
      font-size: .6rem;
      font-weight: 400;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
      margin-top: .15rem;
    }

    .logo-line {
      width: 30px;
      height: 1px;
      background: rgba(196, 164, 100, .4);
      margin: 1rem auto 0;
    }

    /* Label */
    .over {
      font-size: .62rem;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 1rem;
      display: block;
    }

    .headline {
      font-family: var(--ff-d);
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 300;
      text-align: center;
      color: var(--white);
      margin-bottom: .6rem;
      letter-spacing: .01em;
    }

    .subline {
      font-size: .82rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 3rem;
      font-style: italic;
      font-family: var(--ff-d);
    }

    /* Cards */
    .cards {
      display: flex;
      gap: 1.2rem;
      width: 100%;
      max-width: 480px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      flex: 1;
      min-width: 180px;
      max-width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      padding: 2.2rem 1.5rem;
      border: 1px solid rgba(196, 164, 100, .18);
      background: rgba(196, 164, 100, .04);
      text-decoration: none;
      color: var(--white);
      cursor: pointer;
      transition: border-color .28s, background .28s, transform .28s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(196, 164, 100, .08), transparent 70%);
      opacity: 0;
      transition: opacity .3s;
    }

    .card:hover,
    .card:focus-visible {
      border-color: rgba(196, 164, 100, .5);
      background: rgba(196, 164, 100, .08);
      transform: translateY(-3px);
    }

    .card:hover::after {
      opacity: 1;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }

    .card-title {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
    }

    .card-desc {
      font-size: .78rem;
      font-weight: 300;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    /* Footer */
    .foot {
      margin-top: 3.5rem;
      font-size: .68rem;
      color: rgba(196, 164, 100, .3);
      letter-spacing: .08em;
      text-align: center;
    }

    /* card-left solo existe visualmente en móvil */
    .card-left {
      display: contents;
      /* en desktop se ignora el wrapper, los hijos se comportan normal */
    }

    @media (max-width:47.99rem) {

      .logo {
        margin-bottom: 3.5rem;
      }

      .subline {
        margin-bottom: 2.5rem;
      }

      .over {
        margin-bottom: 0.5rem;
      }

      .cards {
        flex-direction: column;
        align-items: stretch;
        max-width: 340px;
      }

      .card {
        flex-direction: row;
        align-items: center;
        max-width: 100%;
        min-width: 0;
        height: auto;
        padding: 1.4rem 1.5rem;
        gap: 1.2rem;
        text-align: left;
      }

      .card-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 0 0 35%;
        gap: .5rem;
      }

      .card-icon {
        flex-shrink: 0;
      }

      .card-title {
        text-align: center;
      }

      .card-desc {
        flex: 1;
        text-align: left;
      }

      .foot {
        margin: 2.5rem 0 0;
      }
    }
  </style>
</head>

<body>

  <div class="logo">
    <span class="logo-l1">Monasterio de la Luz</span>
    <span class="logo-l2">Cañas · La Rioja</span>
    <div class="logo-line"></div>
  </div>

  <span class="over" data-i18n="ag.welcome">Bienvenido · Welcome</span>
  <h1 class="headline" data-i18n="ag.choose">¿Qué deseas consultar?</h1>
  <p class="subline" data-i18n="ag.select">Selecciona una opción para continuar</p>

  <div class="cards">
    <a href="menu-folleto.html" class="card" data-i18n-aria="ag.brochure.title">
      <div class="card-left">
        <div class="card-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
            aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
        </div>
        <span class="card-title" data-i18n="ag.brochure.title">Folleto‑Guía</span>
      </div>
      <p class="card-desc" data-i18n="ag.brochure.desc">Descarga el folleto de visita en tu idioma</p>
    </a>

    <a href="menu-audio.html" class="card" data-i18n-aria="ag.audio.title">
      <div class="card-left">
        <div class="card-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
            aria-hidden="true">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6" />
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z" />
            <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" />
          </svg>
        </div>
        <span class="card-title" data-i18n="ag.audio.title">Audioguía</span>
      </div>
      <p class="card-desc" data-i18n="ag.audio.desc">Escucha la guía de audio del monasterio</p>
    </a>
  </div>

  <p class="foot">Monasterio de Santa María de San Salvador de Cañas</p>

  <script src="../js/i18n.js"></script>
</body>

</html>
