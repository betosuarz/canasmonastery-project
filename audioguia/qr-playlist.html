<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audioguía · Monasterio de Cañas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --stone: #16120e;
      --stone-2: #1e1810;
      --stone-3: #2a231a;
      --gold: #c4a464;
      --gold-dim: rgba(196, 164, 100, .1);
      --white: #faf8f3;
      --muted: rgba(250, 248, 243, .4);
      --ff-d: 'Cormorant Garamond', Georgia, serif;
      --ff-b: 'Jost', sans-serif;
    }

    html,
    body {
      background: var(--stone);
      color: var(--white);
      font-family: var(--ff-b);
      font-weight: 300;
      min-height: 100dvh;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4.5rem 1.2rem 2rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(196, 164, 100, .07) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Back */
    .back {
      position: fixed;
      top: 1.2rem;
      left: 1.2rem;
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .62rem;
      font-weight: 400;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(196, 164, 100, .5);
      text-decoration: none;
      transition: color .2s;
      z-index: 10;
    }

    .back:hover {
      color: var(--gold);
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 2.2rem;
      width: 100%;
      max-width: 560px;
    }

    .page-over {
      font-size: .6rem;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
      margin-bottom: .6rem;
    }

    .page-title {
      font-family: var(--ff-d);
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 300;
      color: var(--white);
      margin-bottom: .3rem;
    }

    .page-sub {
      font-family: var(--ff-d);
      font-size: .9rem;
      font-style: italic;
      color: var(--muted);
    }

    .header-divider {
      width: 30px;
      height: 1px;
      background: rgba(196, 164, 100, .35);
      margin: 1.2rem auto 0;
    }

    /* Wrapper */
    .player-wrap {
      width: 100%;
      max-width: 560px;
    }

    /* ── Playlist ── */
    .playlist {
      width: 100%;
      margin-bottom: 1.8rem;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .85rem 0;
      border-bottom: 1px solid rgba(196, 164, 100, .08);
      cursor: pointer;
      transition: background .18s;
      border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
    }

    .track:first-child {
      border-top: 1px solid rgba(196, 164, 100, .08);
    }

    .track:hover {
      background: rgba(196, 164, 100, .04);
    }

    .track.active {
      background: rgba(196, 164, 100, .06);
    }

    .track-num {
      font-size: .65rem;
      font-weight: 400;
      letter-spacing: .1em;
      color: rgba(196, 164, 100, .4);
      width: 1.4rem;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .track.active .track-num {
      color: var(--gold);
    }

    .track-play-icon {
      width: 1.4rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(196, 164, 100, .35);
    }

    .track.active .track-play-icon {
      color: var(--gold);
    }

    .track-play-icon svg {
      display: none;
    }

    .track.active .track-play-icon svg {
      display: block;
    }

    .track-name {
      flex: 1;
      font-size: .83rem;
      font-weight: 300;
      color: rgba(250, 248, 243, .7);
      letter-spacing: .01em;
    }

    .track.active .track-name {
      color: var(--white);
      font-weight: 400;
    }

    .track-dur {
      font-size: .7rem;
      color: rgba(196, 164, 100, .4);
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      flex-shrink: 0;
      padding-right: 16px;
    }

    .track.active .track-dur {
      color: rgba(196, 164, 100, .7);
    }

    /* ── Player card ── */
    .player-card {
      border: 1px solid rgba(196, 164, 100, .15);
      background: var(--stone-2);
      padding: 1.6rem 1.4rem;
    }

    .now-playing-label {
      font-size: .6rem;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(196, 164, 100, .45);
      margin-bottom: .5rem;
      display: block;
    }

    .now-playing-title {
      font-family: var(--ff-d);
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--white);
      margin-bottom: 1.4rem;
    }

    /* ── Waveform ── */
    .waveform-wrap {
      position: relative;
      height: 56px;
      cursor: pointer;
      margin-bottom: .6rem;
      user-select: none;
      -webkit-user-select: none;
    }

    #waveform-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Time row */
    .time-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.6rem;
    }

    .time-cur,
    .time-rem {
      font-size: .65rem;
      font-weight: 400;
      letter-spacing: .06em;
      color: rgba(196, 164, 100, .5);
      font-variant-numeric: tabular-nums;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .ctrl-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .25rem;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(250, 248, 243, .5);
      padding: .3rem;
      transition: color .2s;
      -webkit-tap-highlight-color: transparent;
    }

    .ctrl-btn:hover {
      color: var(--white);
    }

    .ctrl-btn .ctrl-label {
      font-size: .52rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(196, 164, 100, .35);
    }

    .ctrl-btn--play {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(196, 164, 100, .3);
      background: rgba(196, 164, 100, .06);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .2s, background .2s, color .2s;
      flex-direction: row;
      gap: 0;
    }

    .ctrl-btn--play:hover {
      border-color: var(--gold);
      background: rgba(196, 164, 100, .14);
      color: var(--white);
    }

    /* Footer */
    .foot {
      margin-top: 2.5rem;
      font-size: .62rem;
      color: rgba(196, 164, 100, .25);
      letter-spacing: .08em;
      text-align: center;
    }
  </style>
</head>

<body>

  <a href="menu-audio.html" class="back" aria-label="Volver a idiomas">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      aria-hidden="true">
      <polyline points="15 18 9 12 15 6" />
    </svg>
    Idiomas
  </a>

  <div class="page-header">
    <span class="page-over" id="lang-label">Audioguía · Español</span>
    <h1 class="page-title">Audioguía de Cañas</h1>
    <p class="page-sub">Monasterio de San Salvador de Cañas</p>
    <div class="header-divider"></div>
  </div>

  <div class="player-wrap">

    <!-- Playlist -->
    <div class="playlist" id="playlist" role="list">
      <!-- Tracks generados por JS -->
    </div>

    <!-- Player -->
    <div class="player-card" role="region" aria-label="Reproductor de audio">
      <span class="now-playing-label">Reproduciendo</span>
      <p class="now-playing-title" id="now-title">—</p>

      <!-- Waveform -->
      <div class="waveform-wrap" id="waveform-wrap" aria-hidden="true">
        <canvas id="waveform-canvas"></canvas>
      </div>

      <!-- Times -->
      <div class="time-row">
        <span class="time-cur" id="time-cur">0:00</span>
        <span class="time-rem" id="time-rem">-0:00</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn" id="btn-rew" aria-label="15 segundos atrás">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
            aria-hidden="true">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 .49-3.35" />
          </svg>
          <span class="ctrl-label">−15s</span>
        </button>

        <button class="ctrl-btn" id="btn-prev" aria-label="Pista anterior">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
            aria-hidden="true">
            <polygon points="19 20 9 12 19 4 19 20" />
            <line x1="5" y1="19" x2="5" y2="5" />
          </svg>
          <span class="ctrl-label">Anterior</span>
        </button>

        <button class="ctrl-btn ctrl-btn--play" id="btn-play" aria-label="Reproducir">
          <!-- Play icon -->
          <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
          <!-- Pause icon -->
          <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
            style="display:none">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
          </svg>
        </button>

        <button class="ctrl-btn" id="btn-next" aria-label="Pista siguiente">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
            aria-hidden="true">
            <polygon points="5 4 15 12 5 20 5 4" />
            <line x1="19" y1="5" x2="19" y2="19" />
          </svg>
          <span class="ctrl-label">Siguiente</span>
        </button>

        <button class="ctrl-btn" id="btn-fwd" aria-label="30 segundos adelante">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
            aria-hidden="true">
            <polyline points="23 4 23 10 17 10" />
            <path d="M20.49 15a9 9 0 1 1-.49-3.35" />
          </svg>
          <span class="ctrl-label">+30s</span>
        </button>
      </div>
    </div>

  </div>

  <p class="foot">Monasterio de Santa María de San Salvador de Cañas</p>

  <audio id="audio-el" preload="none"></audio>

  <script>
    (function () {

      /* ─── Datos por idioma ─── */
      const LANGS = {
        es: {
          label: 'Audioguía · Español', tracks: [
            { title: 'Historia de la Abadía', dur: '1:21', src: '/assets/audio/es/01-historia.wav' },
            { title: 'La Iglesia', dur: '1:21', src: '/assets/audio/es/02-iglesia.wav' },
            { title: 'Sala Capitular', dur: '0:44', src: '/assets/audio/es/03-sala-capitular.wav' },
            { title: 'El Claustro', dur: '0:29', src: '/assets/audio/es/04-claustro.wav' },
            { title: 'Sala de Reliquias', dur: '0:31', src: '/assets/audio/es/05-sala-reliquias.wav' },
            { title: 'Cilla‑Museo', dur: '0:38', src: '/assets/audio/es/06-cilla-museo.wav' },
          ]
        },
        en: {
          label: 'Audio Guide · English', tracks: [
            { title: 'History of the Abbey', dur: '1:21', src: '/assets/audio/en/01-history.wav' },
            { title: 'The Church', dur: '1:21', src: '/assets/audio/en/02-church.wav' },
            { title: 'Chapter House', dur: '0:44', src: '/assets/audio/en/03-chapter-house.wav' },
            { title: 'The Cloister', dur: '0:29', src: '/assets/audio/en/04-cloister.wav' },
            { title: 'Relics Room', dur: '0:31', src: '/assets/audio/en/05-reliquary-room.wav' },
            { title: 'Cilla Museum', dur: '0:38', src: '/assets/audio/en/06-museum-cellar.wav' },
          ]
        },
        de: {
          label: 'Audioführer · Deutsch', tracks: [
            { title: 'Geschichte der Abtei', dur: '1:21', src: '/assets/audio/de/01-geschichte.wav' },
            { title: 'Die Kirche', dur: '1:21', src: '/assets/audio/de/02-kirche.wav' },
            { title: 'Kapitelsaal', dur: '0:44', src: '/assets/audio/de/03-kapitelsaal.wav' },
            { title: 'Der Kreuzgang', dur: '0:29', src: '/assets/audio/de/04-kloster.wav' },
            { title: 'Reliquiensaal', dur: '0:31', src: '/assets/audio/de/05-reliquiensammlung.wav' },
            { title: 'Cilla‑Museum', dur: '0:38', src: '/assets/audio/de/06-kornhaus-museum.wav' },
          ]
        },
        fr: {
          label: 'Audioguide · Français', tracks: [
            { title: "Histoire de l'Abbaye", dur: '1:21', src: '/assets/audio/fr/01-histoire.wav' },
            { title: 'L\'Église', dur: '1:21', src: '/assets/audio/fr/02-chapelle.wav' },
            { title: 'Salle Capitulaire', dur: '0:44', src: '/assets/audio/fr/03-salle-capitulaire.wav' },
            { title: 'Le Cloître', dur: '0:29', src: '/assets/audio/fr/04-cloître.wav' },
            { title: 'Salle des Reliques', dur: '0:31', src: '/assets/audio/fr/05-salle-reliques.wav' },
            { title: 'Cilla‑Musée', dur: '0:38', src: '/assets/audio/fr/06-cellier-musée.wav' },
          ]
        },
        it: {
          label: 'Audioguida · Italiano', tracks: [
            { title: "Storia dell'Abbazia", dur: '1:21', src: '/assets/audio/it/01-storia.wav' },
            { title: 'La Chiesa', dur: '1:21', src: '/assets/audio/it/02-chiesa.wav' },
            { title: 'Sala Capitolare', dur: '0:44', src: '/assets/audio/it/03-sala-capitolare.wav' },
            { title: 'Il Chiostro', dur: '0:29', src: '/assets/audio/it/04-chiostro.wav' },
            { title: 'Sala delle Reliquie', dur: '0:31', src: '/assets/audio/it/05-sala-reliquie.wav' },
            { title: 'Cilla‑Museo', dur: '0:38', src: '/assets/audio/it/06-cilla-museo.wav' },
          ]
        },
        pt: {
          label: 'Audioguia · Português', tracks: [
            { title: 'História da Abadia', dur: '1:21', src: '/assets/audio/pt/01-história.wav' },
            { title: 'A Igreja', dur: '1:21', src: '/assets/audio/pt/02-igreja.wav' },
            { title: 'Sala Capitular', dur: '0:44', src: '/assets/audio/pt/03-sala-capitular.wav' },
            { title: 'O Claustro', dur: '0:29', src: '/assets/audio/pt/04-claustro.wav' },
            { title: 'Sala das Relíquias', dur: '0:31', src: '/assets/audio/pt/05-sala-relíquias.wav' },
            { title: 'Cilla‑Museu', dur: '0:38', src: '/assets/audio/pt/06-cilla-museu.wav' },
          ]
        },
        ko: {
          label: '오디오 가이드 · 한국어', tracks: [
            { title: '수도원의 역사', dur: '1:21', src: '/assets/audio/co/01-아바디아.wav' },
            { title: '교회', dur: '1:21', src: '/assets/audio/co/02-교회.wav' },
            { title: '참사회실', dur: '0:44', src: '/assets/audio/co/03-사라-카피툴라.wav' },
            { title: '회랑', dur: '0:29', src: '/assets/audio/co/04-클로이스터.wav' },
            { title: '성유물실', dur: '0:31', src: '/assets/audio/co/05-사라-렐리키아스.wav' },
            { title: '실라 박물관', dur: '0:38', src: '/assets/audio/co/06-실라-뮤세오.wav' },
          ]
        },
      };

      /* ─── Detectar idioma ─── */
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') || 'es';
      const data = LANGS[lang] || LANGS.es;

      document.getElementById('lang-label').textContent = data.label;
      document.title = data.label + ' · Monasterio de Cañas';

      /* ─── Estado ─── */
      const audio = document.getElementById('audio-el');
      let current = 0;
      let isPlaying = false;
      let waveData = [];
      let animFrame = null;

      /* ─── Waveform ─── */
      const canvas = document.getElementById('waveform-canvas');
      const ctx = canvas.getContext('2d');
      const wrap = document.getElementById('waveform-wrap');

      function resizeCanvas() {
        canvas.width = wrap.clientWidth * devicePixelRatio;
        canvas.height = wrap.clientHeight * devicePixelRatio;
        ctx.scale(devicePixelRatio, devicePixelRatio);
        drawWave();
      }

      function generateWave(n) {
        const arr = [];
        for (let i = 0; i < n; i++) {
          const base = .2 + Math.random() * .5;
          const bump = Math.random() > .85 ? .3 + Math.random() * .3 : 0;
          arr.push(Math.min(1, base + bump));
        }
        return arr;
      }

      function drawWave() {
        const W = wrap.clientWidth;
        const H = wrap.clientHeight;
        ctx.clearRect(0, 0, W, H);

        const bars = Math.floor(W / 3);
        const barW = 1.5;
        const gap = (W - bars * barW) / (bars - 1);
        const prog = audio.duration ? audio.currentTime / audio.duration : 0;
        const progX = prog * W;

        if (waveData.length !== bars) waveData = generateWave(bars);

        for (let i = 0; i < bars; i++) {
          const x = i * (barW + gap);
          const h = waveData[i] * H;
          const y = (H - h) / 2;
          const done = x + barW < progX;
          const curr = x <= progX && x + barW >= progX;

          ctx.fillStyle = done || curr
            ? 'rgba(196,164,100,.85)'
            : 'rgba(250,248,243,.12)';
          ctx.fillRect(x, y, barW, h);
        }
      }

      function animate() {
        drawWave();
        updateTimes();
        if (isPlaying) animFrame = requestAnimationFrame(animate);
      }

      /* ─── Times ─── */
      function fmtTime(s) {
        if (isNaN(s) || !isFinite(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ':' + String(sec).padStart(2, '0');
      }

      function updateTimes() {
        const cur = audio.currentTime || 0;
        const dur = audio.duration || 0;
        document.getElementById('time-cur').textContent = fmtTime(cur);
        document.getElementById('time-rem').textContent = dur ? '−' + fmtTime(dur - cur) : '−0:00';
      }

      /* ─── Playlist render ─── */
      function renderPlaylist() {
        const pl = document.getElementById('playlist');
        pl.innerHTML = '';
        data.tracks.forEach((t, i) => {
          const row = document.createElement('div');
          row.className = 'track' + (i === current ? ' active' : '');
          row.setAttribute('role', 'listitem');
          row.setAttribute('tabindex', '0');
          row.setAttribute('aria-label', `Pista ${i + 1}: ${t.title}`);
          row.innerHTML = `
          <span class="track-num">${i + 1}</span>
          <span class="track-play-icon">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </span>
          <span class="track-name">${t.title}</span>
          <span class="track-dur">${t.dur}</span>`;
          row.addEventListener('click', () => loadTrack(i, true));
          row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); loadTrack(i, true); } });
          pl.appendChild(row);
        });
      }

      /* ─── Load track ─── */
      function loadTrack(idx, autoplay) {
        current = idx;
        const t = data.tracks[idx];
        audio.src = t.src;
        document.getElementById('now-title').textContent = t.title;
        waveData = [];
        updateTimes();
        drawWave();
        renderPlaylist();
        if (autoplay) {
          audio.play().then(() => {
            isPlaying = true;
            updatePlayBtn();
            cancelAnimationFrame(animFrame);
            animate();
          }).catch(() => { });
        } else {
          isPlaying = false;
          updatePlayBtn();
        }
      }

      function updatePlayBtn() {
        document.getElementById('icon-play').style.display = isPlaying ? 'none' : 'block';
        document.getElementById('icon-pause').style.display = isPlaying ? 'block' : 'none';
        document.getElementById('btn-play').setAttribute('aria-label', isPlaying ? 'Pausar' : 'Reproducir');
      }

      /* ─── Controls ─── */
      document.getElementById('btn-play').addEventListener('click', () => {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          cancelAnimationFrame(animFrame);
          drawWave();
        } else {
          if (!audio.src) loadTrack(0, true);
          else audio.play().then(() => {
            isPlaying = true;
            cancelAnimationFrame(animFrame);
            animate();
          }).catch(() => { });
        }
        updatePlayBtn();
      });

      document.getElementById('btn-prev').addEventListener('click', () => {
        loadTrack((current - 1 + data.tracks.length) % data.tracks.length, isPlaying);
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        loadTrack((current + 1) % data.tracks.length, isPlaying);
      });

      document.getElementById('btn-rew').addEventListener('click', () => {
        audio.currentTime = Math.max(0, (audio.currentTime || 0) - 15);
        drawWave(); updateTimes();
      });

      document.getElementById('btn-fwd').addEventListener('click', () => {
        audio.currentTime = Math.min(audio.duration || 0, (audio.currentTime || 0) + 30);
        drawWave(); updateTimes();
      });

      /* Waveform click → seek */
      wrap.addEventListener('click', e => {
        if (!audio.duration) return;
        const rect = wrap.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        audio.currentTime = ratio * audio.duration;
        drawWave(); updateTimes();
      });

      /* Audio events */
      audio.addEventListener('ended', () => {
        if (current < data.tracks.length - 1) {
          loadTrack(current + 1, true);
        } else {
          isPlaying = false;
          updatePlayBtn();
          cancelAnimationFrame(animFrame);
          drawWave();
        }
      });

      audio.addEventListener('timeupdate', () => { if (!isPlaying) { drawWave(); updateTimes(); } });

      /* Resize */
      window.addEventListener('resize', resizeCanvas);

      /* ─── Init ─── */
      renderPlaylist();
      loadTrack(0, false);
      resizeCanvas();

    })();
  </script>

</body>

</html>
